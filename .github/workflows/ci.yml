name: CI

on:
  push:
    branches: [master, develop, "feature/**"]
  pull_request:

jobs:
  build:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, ejecutar tests y comprobar cobertura
        run: mvn -B verify
      - name: Ejecutar el programa de demostración
        run: mvn -B -q exec:java
      - name: Guardar informe de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-jacoco
          path: target/site/jacoco/
